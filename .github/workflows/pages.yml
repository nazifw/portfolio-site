name: Deploy site to GitHub Pages

# Publishes ONLY the site/ folder. The admin/ folder is a local tool and is never deployed.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# It only runs when you start it (Actions tab -> Run workflow), so a fresh clone
# does not show a red failure before Pages is enabled. To deploy on every push to main,
# add the following under `on:`
#   push:
#     branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
